        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    put:
      tags:
        - SANDBOX > SANDBOX - API Cobranca (Boleto com Pix) > WebHook
      summary: Criar ou editar um webhook
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                webhookUrl: https://cobranca.example.com/api/webhook
      security:
        - bearerAuth: []
      parameters:
        - name: x-conta-corrente
          in: header
