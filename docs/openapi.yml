          application/json:
            schema:
              type: object
              example:
                meuIdentificador: Lote 2
                pagamentos:
                  - tipoPagamento: DARF
                    nomeEmpresa: nomeEmpresa
                    periodoApuracao: '2024-07-09'
                    valorPrincipal: 10
