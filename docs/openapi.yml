                    dataVencimento: '2024-07-09'
                    referencia: '555555'
                    nroContaDebito: '8579377'
                    cnpjCpf: '12345678912'
                  - codBarraLinhaDigitavel: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
