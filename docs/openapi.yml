    delete:
      tags:
        - SANDBOX > SANDBOX - API Cobranca (Boleto com Pix) > WebHook
      summary: Excluir webhook
      security:
        - bearerAuth: []
      parameters:
        - name: x-conta-corrente
          in: header
          schema:
            type: string
