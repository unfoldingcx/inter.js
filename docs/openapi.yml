openapi: 3.0.0
info:
  title: Collection
  version: 1.0.0
servers:
  - url: http://{{apipartnersbaseurl}}
  - url: http://{{sandboxbaseurl}}
  - url: https://cdpj.partners.bancointer.com.br
  - url: https://cdpj-sandbox.partners.uatinter.co
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    noauthAuth:
      type: http
      scheme: noauth
tags:
  - name: PRODUÇÃO
  - name: PRODUÇÃO > API Cobranca (Boleto com Pix)
  - name: PRODUÇÃO > API Cobranca (Boleto com Pix) > Cobranças
  - name: PRODUÇÃO > API Cobranca (Boleto com Pix) > WebHook
  - name: PRODUÇÃO > API Banking
  - name: PRODUÇÃO > API Banking > Extrato
  - name: PRODUÇÃO > API Banking > Saldo
  - name: PRODUÇÃO > API Banking > Pagamento
  - name: PRODUÇÃO > API Banking > Pix Pagamento
  - name: PRODUÇÃO > API Banking > Webhook
  - name: PRODUÇÃO > API Pix
  - name: PRODUÇÃO > API Pix > Cobrança imediata
  - name: PRODUÇÃO > API Pix > Cobrancas com Vencimento
  - name: PRODUÇÃO > API Pix > Lote Cobrancas com Vencimento
  - name: PRODUÇÃO > API Pix > Payload Location
  - name: PRODUÇÃO > API Pix > Pix
  - name: PRODUÇÃO > API Pix > Webhook
  - name: SANDBOX
  - name: SANDBOX > SANDBOX - API Cobranca (Boleto com Pix)
  - name: SANDBOX > SANDBOX - API Cobranca (Boleto com Pix) > Cobranças
  - name: SANDBOX > SANDBOX - API Cobranca (Boleto com Pix) > WebHook
  - name: SANDBOX > SANDBOX - API Banking
  - name: SANDBOX > SANDBOX - API Banking > Extrato
  - name: SANDBOX > SANDBOX - API Banking > Saldo
  - name: SANDBOX > SANDBOX - API Banking > Pagamento
  - name: SANDBOX > SANDBOX - API Banking > Webhook
  - name: SANDBOX > SANDBOX - API Pix
  - name: SANDBOX > SANDBOX - API Pix > Cobrança imediata
  - name: SANDBOX > SANDBOX - API Pix > Cobrancas com Vencimento
  - name: SANDBOX > SANDBOX - API Pix > Payload Location
  - name: SANDBOX > SANDBOX - API Pix > Pix
  - name: SANDBOX > SANDBOX - API Pix > Webhook
paths:
  /cobranca/v3/cobrancas:
    get:
      tags:
        - SANDBOX > SANDBOX - API Cobranca (Boleto com Pix) > Cobranças
      summary: Recuperar coleção de cobranças
      security:
        - bearerAuth: []
      parameters:
        - name: x-conta-corrente
          in: header
          schema:
            type: string
          example: '{{x-conta-corrente}}'
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
        - name: dataInicial
          in: query
          schema:
            type: string
          example: '2024-10-01'
        - name: dataFinal
          in: query
          schema:
            type: string
          example: '2024-10-31'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
        - SANDBOX > SANDBOX - API Cobranca (Boleto com Pix) > Cobranças
      summary: Emitir cobrança
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                valorNominal: '100.50'
                seuNumero: recebimento-pix
                dataVencimento: '2025-10-11'
                numDiasAgenda: '30'
                pagador:
                  cpfCnpj: '08951851648'
                  tipoPessoa: FISICA
                  nome: Nome
                  endereco: Rua São Paulo
                  cidade: Belo Horizonte
                  uf: MG
                  cep: '36401042'
                  bairro: Jardim América
                multa:
                  codigo: PERCENTUAL
                  taxa: '0.10'
                mora:
                  codigo: TAXAMENSAL
                  taxa: '0.21'
                desconto:
                  quantidadeDias: 1
                  taxa: 0.3
                  codigo: PERCENTUALDATAINFORMADA
      security:
        - bearerAuth: []
      parameters:
        - name: x-conta-corrente
          in: header
          schema:
            type: string
          example: '{{x-conta-corrente}}'
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /cobranca/v3/cobrancas/{codigoSolicitacao}:
    get:
      tags:
        - SANDBOX > SANDBOX - API Cobranca (Boleto com Pix) > Cobranças
      summary: Recuperar cobrança
      security:
        - bearerAuth: []
      parameters:
        - name: x-conta-corrente
          in: header
          schema:
            type: string
          example: '{{x-conta-corrente}}'
        - name: Content-Type
          in: header
          schema:
            type: string
          example: application/json
        - name: codigoSolicitacao
          in: path
          schema:
            type: string
          required: true
          example: 6f8d70ea-1724-4340-9a4c-2eb0150b0b5d
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /cobranca/v3/cobrancas/{codigoSolicitacao}/pdf:
