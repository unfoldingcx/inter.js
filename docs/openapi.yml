  /cobranca/v3/cobrancas/webhook:
    get:
      tags:
        - SANDBOX > SANDBOX - API Cobranca (Boleto com Pix) > WebHook
      summary: Obter webhook cadastrado
      security:
        - bearerAuth: []
      parameters:
        - name: x-conta-corrente
